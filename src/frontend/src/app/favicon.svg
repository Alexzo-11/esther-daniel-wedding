<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051B42"/>
      <stop offset="50%" stop-color="#0B3D91"/>
      <stop offset="100%" stop-color="#082A66"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C95A"/>
      <stop offset="100%" stop-color="#B8962A"/>
    </linearGradient>
  </defs>

  <!-- Royal Blue Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>

  <!-- Gold Inner Border Rings -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#D4AF37" stroke-width="3" opacity="0.3"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.5"/>

  <!-- Monogram E & D -->
  <text
    x="256"
    y="290"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="200"
    font-weight="bold"
    fill="url(#goldGrad)"
    text-anchor="middle"
    dominant-baseline="middle"
    letter-spacing="-10"
  >
    E<tspan font-size="140" fill="#FFFFFF" opacity="0.85">&amp;</tspan>D
  </text>

  <!-- Small Heart Accent -->
  <path
    d="M 256 400
       C 256 400, 230 375, 230 355
       C 230 340, 245 330, 256 345
       C 267 330, 282 340, 282 355
       C 282 375, 256 400, 256 400 Z"
    fill="#D4AF37"
    opacity="0.9"
  />
</svg>
